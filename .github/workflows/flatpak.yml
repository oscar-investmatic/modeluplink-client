name: Signed Flatpak candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version: 1.27.1 }
      - name: Install build tools and SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.golang//25.08
      - name: Export clean public source and build without build-network access
        run: |
          python3 desktop/source.py
          python3 linux/flatpak/prepare.py
          bash linux/flatpak/build.sh
          python3 linux/flatpak/record-build.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the Flatpak checksum manifest
        working-directory: dist/flatpak/release
        run: |
          cosign sign-blob --yes --bundle flatpak-checksums.txt.sigstore.json flatpak-checksums.txt
          cosign verify-blob --bundle flatpak-checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/flatpak.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            flatpak-checksums.txt
      - name: Attest the actual Flatpak and its build inputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/flatpak/release/*.flatpak
            dist/flatpak/release/flatpak-source.json
            dist/flatpak/release/flatpak-checksums.txt
      - name: Keep the exact candidate for native acceptance and later publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-x86_64-${{ github.sha }}
          path: dist/flatpak/release/*
          if-no-files-found: error
          retention-days: 90
