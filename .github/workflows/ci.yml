name: Client CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: go test -race -tags ci ./...
      - run: go vet -tags ci ./...
      - name: Platform static analysis
        if: runner.os != 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags ci ./...
      - run: python -m unittest discover -s desktop -p 'test_*.py'
      - run: python -O -m unittest discover -s linux/flatpak -p 'test_*.py'
      - name: PowerShell analysis and formatting
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          ./scripts/lint.ps1
      - name: Swift formatting
        if: runner.os == 'macOS'
        run: python scripts/lint.py --swift-only
      - name: Swift helper and desktop contracts
        if: runner.os == 'macOS'
        run: bash macos/test.sh
      - name: Native macOS development package
        if: runner.os == 'macOS'
        run: bash macos/build.sh
      - name: Verify locked dependencies and generated source did not change
        run: git diff --exit-code
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/lint.py
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build and smoke-test DEB and desktop archive
        run: bash linux/build.sh amd64
  release-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
      - name: Install syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          install-only: true
      - name: Package and verify release archives without publishing
        run: python3 scripts/check_release.py
